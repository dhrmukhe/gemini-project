replicaCount: 2

image:
  repository: devops-week1-app
  tag: v5
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

postgres:
  user: postgres
  password: SuperSecretPassword123!
  db: devopsdb

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "512Mi"

# Target CPU metric scaling (2-5 replicas)
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Ingress routing rules for local or domain traffic
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ai-app.local
      paths:
        - path: /
          pathType: Prefix